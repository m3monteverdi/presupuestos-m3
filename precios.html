<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Actualizar precios</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-presupuesto">

    <div class="barra-superior">

        <a href="index.html" class="volver">
            ← Volver al inicio
        </a>

        <span>Actualizar precios</span>

    </div>


    <main class="contenedor-presupuesto">

        <!-- =====================================
             LOGIN ADMINISTRADOR
        ====================================== -->

        <section
            class="hoja-presupuesto"
            id="seccionLogin"
        >

            <h1>Acceso administrador</h1>

            <p class="subtitulo-historial">
                Inicie sesión para actualizar los precios.
            </p>


            <div class="login-admin">

                <div class="precio-item">

                    <label>Email</label>

                    <input
                        type="email"
                        id="emailAdmin"
                        autocomplete="username"
                    >

                </div>


                <div class="precio-item">

                    <label>Contraseña</label>

                    <input
                        type="password"
                        id="passwordAdmin"
                        autocomplete="current-password"
                    >

                </div>


                <button
                    class="boton principal"
                    id="botonLogin"
                >
                    Iniciar sesión
                </button>


                <p
                    id="mensajeLogin"
                    class="mensaje-precios"
                ></p>

            </div>

        </section>


        <!-- =====================================
             PANEL DE PRECIOS
        ====================================== -->

        <section
            class="hoja-presupuesto"
            id="seccionPrecios"
            style="display: none;"
        >

            <div class="encabezado-admin">

                <div>

                    <h1>Actualizar precios</h1>

                    <p class="subtitulo-historial">
                        Los valores guardados serán utilizados
                        en los nuevos presupuestos.
                    </p>

                </div>


                <button
                    class="boton secundario boton-salir"
                    id="botonCerrarSesion"
                >
                    Cerrar sesión
                </button>

            </div>


            <h2 class="titulo-seccion">
                HORMIGONES
            </h2>


            <div class="panel-precios">

                <div class="precio-item">
                    <label>H8</label>
                    <input type="number" id="precioH8">
                </div>

                <div class="precio-item">
                    <label>H13</label>
                    <input type="number" id="precioH13">
                </div>

                <div class="precio-item">
                    <label>H17</label>
                    <input type="number" id="precioH17">
                </div>

                <div class="precio-item">
                    <label>H21</label>
                    <input type="number" id="precioH21">
                </div>

                <div class="precio-item">
                    <label>H25</label>
                    <input type="number" id="precioH25">
                </div>

                <div class="precio-item">
                    <label>H30</label>
                    <input type="number" id="precioH30">
                </div>

                <div class="precio-item">
                    <label>H40</label>
                    <input type="number" id="precioH40">
                </div>

            </div>


            <h2 class="titulo-seccion">
                ADITIVOS
            </h2>


            <div class="panel-precios">

                <div class="precio-item">
                    <label>MR120 superfluidificante</label>
                    <input type="number" id="precioMR120">
                </div>

                <div class="precio-item">
                    <label>MACRO FIBRAS</label>
                    <input type="number" id="precioMacro">
                </div>

            </div>


            <h2 class="titulo-seccion">
                SERVICIOS EXTRAS
            </h2>


            <div class="panel-precios">

                <div class="precio-item">
                    <label>Servicio de bomba</label>
                    <input type="number" id="precioBombaAdmin">
                </div>

                <div class="precio-item">
                    <label>Vibrador</label>
                    <input type="number" id="precioVibradorAdmin">
                </div>

            </div>


            <div class="acciones-presupuesto">

                <button
                    class="boton principal"
                    id="guardarPrecios"
                >
                    Guardar precios
                </button>

            </div>


            <p
                id="mensajePrecios"
                class="mensaje-precios"
            ></p>

        </section>

    </main>


    <!-- LIBRERÍA DE SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- CONEXIÓN A NUESTRO PROYECTO -->

    <script src="supabase-config.js"></script>


    <!-- LÓGICA DE PRECIOS -->

    <script src="precios.js"></script>


</body>

</html>
