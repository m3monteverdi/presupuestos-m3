<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historial de presupuestos</title>

    <link rel="stylesheet" href="style.css?v=3">
</head>

<body class="pagina-presupuesto">

    <div class="barra-superior">

        <a href="index.html" class="volver">
            ← Volver al inicio
        </a>

        <span>Historial</span>

    </div>


    <main class="contenedor-presupuesto">

        <section class="hoja-presupuesto">

            <h1>Historial de presupuestos</h1>

            <p class="subtitulo-historial">
                Presupuestos guardados en la base de datos
            </p>


            <div class="buscador-historial">

                <input
                    type="text"
                    id="buscarPresupuesto"
                    placeholder="Buscar por Señores o Presupuesto N°"
                >

            </div>


            <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:25px;">

                <button
                    type="button"
                    id="descargarTodos"
                    class="boton-historial boton-ver"
                >
                    Descargar todos
                </button>

                <button
                    type="button"
                    id="eliminarTodos"
                    class="boton-historial boton-eliminar"
                >
                    Eliminar todos
                </button>

            </div>


            <div class="tabla-historial">

                <div class="fila-historial encabezado-historial">

                    <div>Presupuesto</div>
                    <div>Presupuesto N°</div>
                    <div>Fecha</div>
                    <div>Tipo</div>
                    <div>Total</div>
                    <div>Acciones</div>

                </div>


                <div id="listaHistorial"></div>

            </div>


            <div
                id="mensajeHistorialVacio"
                class="historial-vacio"
            >
                Cargando presupuestos...
            </div>

        </section>

    </main>


    <!-- SUPABASE -->

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js?v=2"></script>

<script src="auth.js?v=2"></script>

<script src="configuracion-comun.js?v=1"></script>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script src="pdf.js?v=5"></script>

<script src="pdf-configuracion.js?v=2"></script>

<script src="historial.js?v=3"></script>

</body>
</html>
