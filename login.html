<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Monteverdi Cúbico - Iniciar sesión
    </title>

    <link
        rel="stylesheet"
        href="style.css?v=3"
    >

</head>


<body>

    <main class="login-app">

        <div class="login-app-caja">

            <img
                src="assets/logo-monteverdi.png"
                alt="Logo Monteverdi Cúbico"
                class="logo-login"
            >


            <h1>
                Monteverdi Cúbico
            </h1>

            <h2>
                Sistema de Presupuestos
            </h2>


            <p class="login-texto">
                Ingrese con su usuario para acceder al sistema.
            </p>


            <div class="login-campos">

                <label for="loginEmail">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="correo@empresa.com"
                    autocomplete="email"
                >


                <label for="loginPassword">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                >

            </div>


            <button
                id="botonIngresarApp"
                type="button"
            >
                Ingresar
            </button>


            <p id="mensajeLoginApp"></p>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="supabase-config.js"></script>

    <script src="login.js"></script>

</body>

</html>
